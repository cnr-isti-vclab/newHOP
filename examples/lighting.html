<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>newHOP lighting example</title>
  <style>
    html, body, #viewer { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #101316; color: #e5e7eb; font-family: sans-serif; }
    #viewer { position: relative; }
    .hud {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 20;
      max-width: 330px;
      padding: 12px 14px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.84);
      backdrop-filter: blur(4px);
      font-size: 12px;
      line-height: 1.5;
    }
    .hud strong { display: block; margin-bottom: 4px; }
    .hud-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .hud-actions button {
      border: 1px solid rgba(148, 163, 184, 0.45);
      border-radius: 5px;
      padding: 5px 8px;
      background: rgba(30, 41, 59, 0.9);
      color: inherit;
      cursor: pointer;
      font: inherit;
    }
    .hud-actions button:hover { border-color: #93c5fd; }
    .light-controls { display: grid; gap: 4px; margin-top: 10px; }
    .light-controls label { display: flex; align-items: center; gap: 7px; }
    .light-controls input { accent-color: #93c5fd; }
    .flashlight-controls { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(148, 163, 184, 0.3); }
    .flashlight-toggle { display: flex; align-items: center; gap: 7px; }
    .status { margin-top: 8px; color: #93c5fd; }
  </style>
</head>
<body>
  <div id="viewer">
    <div class="hud">
      <strong>Lighting scene</strong>
      <div>Laurana + gargoyle with scene lights and a camera flashlight.</div>
      <div>White probe cube: blue top, red underside, blended sides.</div>
      <div class="light-controls">
        <label><input type="checkbox" data-light="fill"> Hemisphere fill</label>
        <label><input type="checkbox" data-light="key"> Directional key</label>
        <label><input type="checkbox" data-light="rim"> Point rim</label>
        <label><input type="checkbox" data-light="accent"> Spot accent</label>
      </div>
      <div class="flashlight-controls">
        <label class="flashlight-toggle"><input id="flashlight-toggle" type="checkbox"> Flashlight</label>
        <label class="flashlight-toggle"><input id="flashlight-mode-toggle" type="checkbox"> Aim flashlight with drag</label>
        <div class="hud-actions">
          <button id="flashlight-warm" type="button">Warm flashlight</button>
          <button id="flashlight-cold" type="button">Cold flashlight</button>
        </div>
      </div>
      <div class="status" id="status">Loading models...</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Presenter, Toolbar } from '../src/index.ts';

    const presenter = new Presenter({ mount: 'viewer' });
    globalThis.__lightingDebug = presenter;
    globalThis.__THREE = THREE;
    new Toolbar(presenter, {
      position: 'bottom-center',
      buttons: ['home', 'fit', 'zoomIn', 'zoomOut', 'measure', 'section', 'fullscreen']
    });

    presenter.setInteractionMode('pickpoint', {
      handlers: {
        onPick: (result) => console.log('Picked point:', result.point.toArray())
      }
    });

    document.querySelectorAll('[data-light]').forEach((input) => {
      input.addEventListener('change', (event) => {
        const checkbox = event.currentTarget;
        const id = checkbox.dataset.light;
        if (!id) return;
        presenter.lighting.setSceneLightEnabled(id, checkbox.checked);
        document.getElementById('status').textContent = `${id}: ${checkbox.checked ? 'on' : 'off'}`;
      });
    });

    document.getElementById('flashlight-toggle').addEventListener('change', (event) => {
      const checkbox = event.currentTarget;
      presenter.lighting.setFlashlight({ enabled: checkbox.checked });
      document.getElementById('status').textContent = `Flashlight: ${checkbox.checked ? 'on' : 'off'}`;
    });
    document.getElementById('flashlight-mode-toggle').addEventListener('change', (event) => {
      const checkbox = event.currentTarget;
      presenter.setFlashlightMode(checkbox.checked);
      document.getElementById('status').textContent = checkbox.checked
        ? 'Flashlight aim mode: drag to orient'
        : 'Flashlight aim mode: off';
    });
    document.getElementById('flashlight-warm').addEventListener('click', () => {
      presenter.lighting.setFlashlight({ enabled: true, color: 0xffb36b, intensity: 1.5 });
      document.getElementById('flashlight-toggle').checked = true;
      document.getElementById('status').textContent = 'Flashlight: warm';
    });
    document.getElementById('flashlight-cold').addEventListener('click', () => {
      presenter.lighting.setFlashlight({ enabled: true, color: 0xb9dcff, intensity: 1.5 });
      document.getElementById('flashlight-toggle').checked = true;
      document.getElementById('status').textContent = 'Flashlight: cold';
    });

    presenter.onSceneReady(() => {
      document.querySelectorAll('[data-light]').forEach((input) => {
        const id = input.dataset.light;
        if (id) input.checked = presenter.lighting.isSceneLightEnabled(id) ?? false;
      });
      document.getElementById('flashlight-toggle').checked = presenter.lighting.getFlashlight().enabled ?? false;
      document.getElementById('status').textContent = 'Scene ready: lighting is active';
    });

    presenter.setScene({
      world: {
        background: 0x101316,
        camera: { fov: 42 }
      },
      lighting: {
        lights: {
          fill: {
            type: 'hemisphere',
            enabled: true,
            color: 0x666688,
            groundColor: 0x665544,
            intensity: 2.0
          },
          key: {
            type: 'directional',
            enabled: true,
            color: 0xfff1d6,
            intensity: 2.0,
            position: [500, 900, 700],
            target: [0, 100, 0],
            castShadow: true
          },
          rim: {
            type: 'point',
            enabled: false,
            color: 0x7dd3fc,
            intensity: 250000,
            position: [-500, 450, 350],
            distance: 1800,
            decay: 2
          },
          accent: {
            type: 'spot',
            enabled: false,
            color: 0x558855,
            intensity: 120000,
            position: [250, 700, -500],
            target: [0, 100, 0],
            distance: 1800,
            angle: 32,
            penumbra: 0.45,
            decay: 1.5
          }
        },
        flashlight: {
          enabled: false,
          azimuth: 0,
          elevation: 0
        }
      },
      navigation: {
        type: 'turntable',
        upAxis: 'y',
        limits: {
          azimuth: 'free',
          elevation: [-80, 80],
          distance: [500, 3000],
          pan: {
            x: [-700, 700],
            y: [-500, 800],
            z: [-700, 700]
          }
        },
        homeView: {
          target: [0, 100, 0],
          azimuth: -35,
          elevation: 18,
          distance: 1800
        }
      },
      helpers: {
        origin: { type: 'axes', size: 300, color: 0xfbbf24 },
        ground: { type: 'grid', size: 10, spacing: 1, color: 0x64748b, opacity: 0.45 },
        extent: { type: 'sceneextent', color: 0xf472b6, opacity: 0.7 }
      },
      objects: {
        laurana: {
          file: 'models/laurana.ply',
          position: [0, 0, 0],
          scale: 1,
          color: 0xf2f3f5,
          tags: ['main']
        },
        gargoyle: {
          file: 'models/gargo.nxz',
          position: [400, -240, 0],
          rotation: [0, 45, 0],
          scale: [2, 2, 2],
          color: 0xa5b4fc,
          tags: ['secondary']
        },
        zucca: {
          file: 'models/pumpkin.glb',
          position: [-400, -240.0, 0],
          color: 0xa5d8ff,
          visible: true,
          tags: ['secondary']
        },        
        base: {
          geometry: new THREE.BoxGeometry(1200, 80, 900),
          material: new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.82, metalness: 0.08 }),
          position: [0, -280, 0],
          tags: ['base']
        }
      }
    });
  </script>
</body>
</html>
